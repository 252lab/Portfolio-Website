<style>
    /* header - used for the navigation bar */

    body {
        margin: 0;
        padding: 0;
    }

    h2,
    p {
        margin: 10px;
    }

    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #AED581;
    }

    ul li {
        float: right;
    }

    ul li a {
        display: block;
        color: black;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-family: "Consolas";
    }

    ul li a:hover {
        background-color: yellow;
    }

    /* used for the padding around the main contents of the webpage */

    .bodyPadding {
        padding-left: 100px;
        padding-right: 100px;
    }
</style>
